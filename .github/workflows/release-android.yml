name: PhoGram Android OTA release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish PhoGram APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Configure NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Set Android version
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const [major, minor, patch] = require('./package.json').version.split('.').map(Number);
          const versionCode = major * 1_000_000 + minor * 1_000 + patch;
          fs.writeFileSync('src-tauri/gen/android/app/tauri.properties',
            `tauri.android.versionName=${major}.${minor}.${patch}\ntauri.android.versionCode=${versionCode}\n`);
          NODE

      - name: Configure stable PhoGram signing key
        env:
          PHOGRAM_DEBUG_KEYSTORE_BASE64: ${{ secrets.PHOGRAM_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$PHOGRAM_DEBUG_KEYSTORE_BASE64" || { echo "Missing PHOGRAM_ANDROID_DEBUG_KEYSTORE_BASE64 repository secret" >&2; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$PHOGRAM_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build signed APK
        run: npm run android:build -- --target aarch64 --apk

      - name: Prepare release asset
        run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk PhoGram.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PhoGram ${{ github.ref_name }}
          generate_release_notes: true
          files: PhoGram.apk
