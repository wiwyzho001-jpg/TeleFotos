name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish TeleFotos APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Configure NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build signed APK
        run: npm run android:build -- --target aarch64 --apk

      - name: Prepare release asset
        run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk TeleFotos.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: TeleFotos ${{ github.ref_name }}
          generate_release_notes: true
          files: TeleFotos.apk
